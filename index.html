  <body style="background-color: #000000;">
    <!-- Instant Splash Screen - shows before React loads -->
    <div id="splash" style="
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.3s ease-out;
      margin: 0;
      padding: 0;
    ">
      <img 
        src="/loopgate-brand.png" 
        alt="LOOPGATE" 
        style="height: 80px; width: auto; display: block;"
      />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Hide splash once React is ready
      window.addEventListener('load', function() {
        setTimeout(function() {
          var splash = document.getElementById('splash');
          if (splash) {
            splash.style.opacity = '0';
            setTimeout(function() {
              splash.style.display = 'none';
            }, 300);
          }
        }, 800);
      });
    </script>
  </body>
