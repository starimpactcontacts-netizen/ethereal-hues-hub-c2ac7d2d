  <body style="background-color: #ffffff;">
    <!-- Instant Splash Screen - shows before React loads -->
    <div id="splash" style="
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.3s ease-out;

    <script>
      // Hide splash once React is ready
      window.addEventListener('load', function() {
        setTimeout(function() {
          var splash = document.getElementById('splash');
          if (splash) {
            splash.style.opacity = '0';
            setTimeout(function() {
              splash.style.display = 'none';
            }, 300);
          }
        }, 800);
      });
    </script>
