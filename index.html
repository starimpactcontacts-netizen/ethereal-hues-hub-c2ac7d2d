  <body style="background-color: #000000;">
    <!-- Splash: simple spinner while React loads -->
    <div id="splash" style="
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.3s ease-out;
    ">
      <img src="/loopgate-logo.png" alt="Loopgate" style="width: 80px; height: 80px; object-fit: contain; animation: splashPulse 1.5s ease-in-out infinite;" />
      <style>@keyframes splashPulse{0%,100%{opacity:0.6;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}</style>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Hide splash once React is ready
      window.addEventListener('load', function() {
        setTimeout(function() {
          var splash = document.getElementById('splash');
          if (splash) {
            splash.style.opacity = '0';
            setTimeout(function() {
              splash.style.display = 'none';
            }, 300);
          }
        }, 800);
      });
    </script>
  </body>
